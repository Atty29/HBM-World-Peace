name: World Peace Build

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-1_20_1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Forge 1.20.1
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "Set active project to 1.20.1-forge" -q --console=plain --warning-mode=none --stacktrace
          ./gradlew :1.20.1-forge:runData -Pmod.version=0.2.1-world-peace -q --console=plain --warning-mode=none --stacktrace
          ./gradlew :1.20.1-forge:build -Pmod.version=0.2.1-world-peace -q --console=plain --warning-mode=none --stacktrace

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: hbm-world-peace-${{ github.sha }}
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
